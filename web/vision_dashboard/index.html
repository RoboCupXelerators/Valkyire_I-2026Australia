<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vision Dashboard</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Vision Dashboard</div>
      <div class="status" id="status">connecting…</div>
    </header>

    <main class="grid">
      <section class="panel">
        <h2>鸟瞰 / 雷达</h2>
        <canvas id="radar" width="520" height="520"></canvas>
        <div class="hint">坐标单位：cm（X前进，Y左）</div>
      </section>

      <section class="panel">
        <h2>目标列表</h2>
        <div class="kv">
          <div class="k">Ball</div>
          <div class="v" id="ballPos">-</div>
          <div class="k">BallBBox</div>
          <div class="v" id="ballBBox">-</div>
        </div>
        <h3>Chassis</h3>
        <table class="table" id="chassisTable">
          <thead>
            <tr>
              <th>#</th>
              <th>X(cm)</th>
              <th>Y(cm)</th>
              <th>W</th>
              <th>H</th>
              <th>Conf</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <div class="counters" id="counters"></div>
      </section>

      <section class="panel span2">
        <h2>相机画面</h2>
        <div class="cams">
          <div class="cam">
            <div class="camTitle">Front (0)</div>
            <div class="camWrap"><img id="cam0" /><canvas class="overlay" id="ov0"></canvas></div>
          </div>
          <div class="cam">
            <div class="camTitle">Right (1)</div>
            <div class="camWrap"><img id="cam1" /><canvas class="overlay" id="ov1"></canvas></div>
          </div>
          <div class="cam">
            <div class="camTitle">Back (2)</div>
            <div class="camWrap"><img id="cam2" /><canvas class="overlay" id="ov2"></canvas></div>
          </div>
          <div class="cam">
            <div class="camTitle">Left (3)</div>
            <div class="camWrap"><img id="cam3" /><canvas class="overlay" id="ov3"></canvas></div>
          </div>
        </div>
        <div class="hint">说明：bbox 坐标来自 640x640 推理输入空间（仅 TI 后端提供）。页面会按图像显示尺寸进行缩放叠加。</div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
