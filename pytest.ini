[pytest]
testpaths = src/tests
pythonpath = src
addopts = -v -m "not dm2325 and not imu and not camera"
markers =
    dm2325: tests for the DM-S2325 chassis backend and protocol
    imu: tests for IMU telemetry and web streaming
    entrypoint: tests for source-root CLI entrypoints
    camera: tests requiring camera-platform behavior
